<div class="register-container">

    <div class="card">
  
      <h2>Register</h2>
  
      <form [formGroup]="registerForm" (ngSubmit)="register()">
  
        <div class="form-group">
          <label>Full Name</label>
  
          <input
            type="text"
            formControlName="fullName"
            class="form-control">
  
          <small
            class="error"
            *ngIf="submitted && formControls['fullName'].invalid">
            Full Name is required
          </small>
        </div>
  
        <div class="form-group">
          <label>Email</label>
  
          <input
            type="email"
            formControlName="email"
            class="form-control">
  
          <small
            class="error"
            *ngIf="submitted && formControls['email'].invalid">
            Enter a valid email
          </small>
        </div>
  
        <div class="form-group">
          <label>Password</label>
  
          <input
            type="password"
            formControlName="password"
            class="form-control">
  
          <small
            class="error"
            *ngIf="submitted && formControls['password'].invalid">
            Password must be at least 6 characters
          </small>
        </div>
  
        <div class="form-group">
          <label>Confirm Password</label>
  
          <input
            type="password"
            formControlName="confirmPassword"
            class="form-control">
  
          <small
            class="error"
            *ngIf="submitted && formControls['confirmPassword'].invalid">
            Confirm Password is required
          </small>
        </div>
  
        <button type="submit">
          Register
        </button>
  
      </form>
  
    </div>
  
  </div>
