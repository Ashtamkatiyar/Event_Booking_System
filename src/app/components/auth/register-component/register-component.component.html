<div class="register-page">

  <div class="register-container">

    <div class="card">

      <!-- Brand -->
      <div class="brand">

        <div class="brand-icon">
          <svg viewBox="0 0 24 24">
            <rect x="3" y="4" width="18" height="18" rx="2"/>
            <line x1="16" y1="2" x2="16" y2="6"/>
            <line x1="8" y1="2" x2="8" y2="6"/>
            <line x1="3" y1="10" x2="21" y2="10"/>
          </svg>
        </div>

        <h1>EventHub</h1>
        <p>Create your account</p>

      </div>

      <!-- Secure Badge -->
      <div class="secure-badge">
        <svg viewBox="0 0 24 24">
          <rect x="5" y="11" width="14" height="10" rx="2"/>
          <path d="M8 11V7a4 4 0 0 1 8 0v4"/>
        </svg>
        Secure registration
      </div>

      <hr class="section-divider">

      <h2>Create Account</h2>

      <form [formGroup]="registerForm" (ngSubmit)="register()">

        <!-- Full Name -->
        <div class="form-group">
          <label>Full Name</label>

          <input
            type="text"
            class="form-control"
            placeholder="Enter your full name"
            formControlName="fullName">

          <small class="error"
                 *ngIf="submitted && formControls['fullName'].invalid">
            Full Name is required
          </small>
        </div>

        <!-- Email -->
        <div class="form-group">
          <label>Email Address</label>

          <input
            type="email"
            class="form-control"
            placeholder="you@example.com"
            formControlName="email">

          <small class="error"
                 *ngIf="submitted && formControls['email'].invalid">
            Enter a valid email
          </small>
        </div>

        <!-- Password -->
        <div class="form-group">
          <label>Password</label>

          <input
            type="password"
            class="form-control"
            placeholder="••••••••"
            formControlName="password">

          <small class="error"
                 *ngIf="submitted && formControls['password'].invalid">
            Password must be at least 6 characters
          </small>
        </div>

        <!-- Confirm Password -->
        <div class="form-group">
          <label>Confirm Password</label>

          <input
            type="password"
            class="form-control"
            placeholder="••••••••"
            formControlName="confirmPassword">

          <small class="error"
                 *ngIf="submitted && formControls['confirmPassword'].invalid">
            Confirm Password is required
          </small>
        </div>

        <button class="btn-register" type="submit">
          Create Account
        </button>

      </form>

      <div class="login-link">
        Already have an account?
        <a routerLink="/login">Login</a>
      </div>

    </div>

  </div>

</div>
