<div class="login-container">

    <div class="card">
  
      <h2>Login</h2>
  
      <form [formGroup]="loginForm" (ngSubmit)="login()">
  
        <div class="form-group">
          <label>Email</label>
  
          <input
            type="email"
            formControlName="email"
            class="form-control">
  
          <small
            class="error"
            *ngIf="submitted && formControls['email'].invalid">
  
            Enter a valid email
  
          </small>
        </div>
  
        <div class="form-group">
  
          <label>Password</label>
  
          <input
            type="password"
            formControlName="password"
            class="form-control">
  
          <small
            class="error"
            *ngIf="submitted && formControls['password'].invalid">
  
            Password is required
  
          </small>
  
        </div>
  
        <button type="submit">
          Login
        </button>
  
      </form>
  
    </div>
  
  </div>
