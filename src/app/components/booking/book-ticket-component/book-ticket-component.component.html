<div
  class="container"
  *ngIf="event">

  <h2>Book Ticket</h2>

  <h3>
    {{ event.title }}
  </h3>

  <p>
    Category:
    {{ event.category }}
  </p>

  <p>
    Venue:
    {{ event.venue.name }}
  </p>

  <p>
    Available Seats:
    {{ event.availableSeats }}
  </p>

  <label>

    Number of Tickets

  </label>

  <input
    type="number"
    min="1"
    [(ngModel)]="quantity">

  <br><br>

  <button
    (click)="bookTicket()">

    Confirm Booking

  </button>

</div>
