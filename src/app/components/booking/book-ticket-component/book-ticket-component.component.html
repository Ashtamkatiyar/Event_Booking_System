<div class="container">

    <h2>Book Ticket</h2>

    <label>Event</label>

    <select [(ngModel)]="selectedEvent">

        <option>
            Angular Developer Conference
        </option>

        <option>
            Music Night 2026
        </option>

    </select>

    <br><br>

    <label>Number of Tickets</label>

    <input
        type="number"
        min="1"
        [(ngModel)]="quantity">

    <br><br>

    <button (click)="bookTicket()">
        Book Now
    </button>

</div>
