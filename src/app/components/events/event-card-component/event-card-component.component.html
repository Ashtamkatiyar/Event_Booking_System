<div class="card">

    <h3>{{ event.title }}</h3>
  
    <p>
      <strong>Category:</strong>
      {{ event.category }}
    </p>
  
    <p>
      <strong>Venue:</strong>
      {{ event.venue.name }}
    </p>
  
    <p>
      <strong>City:</strong>
      {{ event.venue.city }}
    </p>
  
    <p>
      <strong>Start Date:</strong>
      {{ event.schedule.startDate }}
    </p>
  
    <p>
      <strong>Status:</strong>
      {{ event.status }}
    </p>
  
    <p>
      <strong>Available Seats:</strong>
      {{ event.availableSeats }}
    </p>
  
    <button>
      View Details
    </button>
  
  </div>
