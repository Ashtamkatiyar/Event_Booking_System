<div class="filter-wrapper">

  <div class="filter-header">

    <div>
      <h3>Discover Events</h3>
      <p>Find experiences tailored to your interests</p>
    </div>

    <div class="event-counter">
      {{ totalEvents }} Events Available
    </div>

  </div>

  <div class="filter-container">

    <!-- Search -->

    <div class="input-group">

      <span class="input-icon">
        🔍
      </span>

      <input
        type="text"
        placeholder="Search events..."
        [ngModel]="searchText()"
        (ngModelChange)="onSearchChange($event)"
      />

    </div>

    <!-- Category -->

    <div class="select-group">

      <select
        [ngModel]="selectedCategory()"
        (ngModelChange)="onCategoryChange($event)">

        <option value="">
          All Categories
        </option>

        <option value="Music">
          🎵 Music
        </option>

        <option value="Technology">
          💻 Technology
        </option>

        <option value="Sports">
          ⚽ Sports
        </option>

        <option value="Education">
          📚 Education
        </option>

        <option value="Business">
          💼 Business
        </option>

        <option value="Entertainment">
          🎭 Entertainment
        </option>

      </select>

    </div>

    <button
      class="clear-btn"
      (click)="clearFilters()">

      ✖ Clear

    </button>

  </div>

  <!-- Quick Filters -->

  <div class="quick-filters">

    <button
      class="chip"
      (click)="selectQuickCategory('Music')">
      🎵 Music
    </button>

    <button
      class="chip"
      (click)="selectQuickCategory('Technology')">
      💻 Technology
    </button>

    <button
      class="chip"
      (click)="selectQuickCategory('Sports')">
      ⚽ Sports
    </button>

    <button
      class="chip"
      (click)="selectQuickCategory('Business')">
      💼 Business
    </button>

  </div>

</div>
