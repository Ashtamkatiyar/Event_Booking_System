<div class="filter-wrapper">

  <h3>Find Events</h3>

  <div class="filter-container">

    <input
  type="text"
  placeholder="Search by event title..."
  [ngModel]="searchText()"
  (ngModelChange)="
    searchText.set($event)
  ">

    <select
  [ngModel]="selectedCategory()"
  (ngModelChange)="
    selectedCategory.set($event)
  ">

      <option value="">
        All Categories
      </option>

      <option value="Music">
        Music
      </option>

      <option value="Technology">
        Technology
      </option>

      <option value="Sports">
        Sports
      </option>

      <option value="Education">
        Education
      </option>

      <option value="Business">
        Business
      </option>

      <option value="Entertainment">
        Entertainment
      </option>

    </select>

    <button
      (click)="applyFilter()">

      Search

    </button>

  </div>

</div>
